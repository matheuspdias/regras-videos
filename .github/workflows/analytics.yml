name: analytics
on:
  schedule:
    - cron: '17 9 * * *'   # diário 06:17 BRT — mantém os relatórios de CTR baixados (a API só guarda ~60 dias)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: analytics
  cancel-in-progress: false
jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Puxar números do canal
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 -u tools/yt_analytics.py
      - name: Commit
        run: |
          git config user.name "analytics-bot"
          git config user.email "actions@github.com"
          git add -A analytics
          git diff --cached --quiet || git commit -m "analytics $(date +%F)"
          git pull --rebase -q && git push
