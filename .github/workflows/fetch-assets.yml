name: fetch-assets
on:
  push:
    paths: ['assets_in/*.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar arquivos listados
        run: |
          set -e
          for f in assets_in/*.json; do
            python3 - "$f" <<'PY'
          import json, os, sys, urllib.request
          spec = json.load(open(sys.argv[1]))
          for item in spec['files']:
              dest = item['dest']
              if os.path.exists(dest):
                  continue
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              for attempt in range(4):
                  try:
                      urllib.request.urlretrieve(item['url'], dest)
                      break
                  except Exception as e:
                      print('retry', dest, e)
              print('ok', dest, os.path.getsize(dest))
          PY
          done
      - name: Commit
        run: |
          git config user.name "fetch-bot"
          git config user.email "actions@github.com"
          git rm -q assets_in/*.json || true
          git add -A media || true
          git diff --cached --quiet || git commit -m "assets baixados"
          git push
